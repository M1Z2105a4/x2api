name: 91PinSe Monitor

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '15,55 0-23/2 * * *'
    - cron: '35 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: '91PinSe 站点入口'
        required: false
        default: 'https://91pinse.com/v/'
      max_pages:
        description: '单次最多分页数（最多 10 页）'
        required: false
        default: '10'

jobs:
  monitor-pinse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install dependencies
        working-directory: collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 91PinSe monitor
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_NAMESPACE: x2api
          BASE_URL: ${{ inputs.base_url || vars.PINSE_BASE_URL || 'https://91pinse.com/v/' }}
          MAX_PAGES: ${{ inputs.max_pages || vars.PINSE_MONITOR_MAX_PAGES || '10' }}
        run: python twitter_monitor.py monitor-pinse --base-url "${BASE_URL}" --max-pages "${MAX_PAGES}" --retention-hours 84
