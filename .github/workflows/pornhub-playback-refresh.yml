name: Pornhub Playback Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  refresh-pornhub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt
      - name: Install dependencies
        working-directory: collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh Pornhub playback URLs
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_NAMESPACE: x2api
        run: python twitter_monitor.py refresh-pornhub-playback-urls --limit 50
