name: Update Nitter Instances

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write

concurrency:
  group: x2ding-main-write
  cancel-in-progress: false

on:
  schedule:
    # 每 6 小时运行一次
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  update-instances:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run update script
      working-directory: collector
      run: |
        python update_instances.py

    - name: Persist updated instance cache
      run: |
        if git diff --quiet -- instances.json; then
          echo "Nitter instance cache is unchanged"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add instances.json
        git commit -m "chore: update Nitter instances"
        git push
