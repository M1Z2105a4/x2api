name: Pornhub Monitor

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '10,50 0-23/2 * * *'
    - cron: '30 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Pornhub 推荐入口'
        required: false
        default: 'https://cn.pornhub.com/recommended?o=time'
      max_pages:
        description: '单次最多分页数（最多 5 页）'
        required: false
        default: '5'

jobs:
  monitor-pornhub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt
      - name: Install dependencies
        working-directory: collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pornhub monitor
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_NAMESPACE: x2api
          BASE_URL: ${{ inputs.base_url || vars.PORNHUB_BASE_URL || 'https://cn.pornhub.com/recommended?o=time' }}
          MAX_PAGES: ${{ inputs.max_pages || vars.PORNHUB_MONITOR_MAX_PAGES || '5' }}
        run: |
          python twitter_monitor.py monitor-pornhub \
            --base-url "${BASE_URL}" \
            --max-pages "${MAX_PAGES}" \
            --retention-hours 84
